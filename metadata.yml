Identifier: eos7iak
Slug: antimicrobial-activity-campylobacter
Status: In progress
Title: Antimicrobial activity prediction against Campylobacter spp. from public 
  ChEMBL data
Description: Bioactivity prediction of growth inhibition in Campylobacter spp., 
  trained as a binary (active/inactive) classifier from publicly available data 
  in ChEMBL. The model is trained on a dose-response (MIC) assay. The output is 
  a single ranking score; no consensus is computed because only one model is 
  available.
