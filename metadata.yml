Title: Antimicrobial activity prediction against Campylobacter spp. from public ChEMBL data
Description: 'Predicts growth inhibition of Campylobacter species, among the most common causes of bacterial gastroenteritis worldwide and increasingly resistant to fluoroquinolones. Public bioactivity data for this genus proved sufficient for only a single dose-response classifier, leaving no ensemble to average across. That sparsity is itself informative: Campylobacter attracts far less antibacterial screening than its clinical burden would suggest, and predictions should be treated as exploratory.'
